# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: 'Build tool container'
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .mise.toml
      - .github/workflows/push-mise-container.yaml

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: Build container
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/stevewm/tools
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: '${{ secrets.BOTTY_HILL_CLIENT_ID }}'
          private-key: '${{ secrets.BOTTY_HILL_PRIVATE_KEY }}'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: '${{ steps.app-token.outputs.token }}'

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - run: crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - run: echo "TAG=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push container
        run: mise oci push --tool crane "${{ env.TAG }}"

      - name: Clean up old images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: tools
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'true'
