---
services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.138.0@sha256:9d8d10b795f7ef4372088475fd16277d7b79a0e85434fbfc34270e26fb90ddea

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

    environment:
      TZ: Europe/Amsterdam
      SELF_UPDATE_ENABLED: 'true'
      SELF_UPDATE_STRATEGY: auto
      DEPLOY_CONFIG_BASE_DIR: ./nas/containers
      POLL_CONFIG: |
        - url: https://github.com/stevewm/homelab.git
          reference: main
          interval: 300
    restart: unless-stopped

    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  data:
