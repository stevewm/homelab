---
services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.136.0@sha256:fa55a3a431e479163a06dd42b8d59ceb90483e958056fd8f325b304aaf3d2a97

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

    environment:
      TZ: Europe/Amsterdam
      SELF_UPDATE_ENABLED: 'true'
      SELF_UPDATE_STRATEGY: auto
      DEPLOY_CONFIG_BASE_DIR: ./nas/containers
      POLL_CONFIG: |
        - url: https://github.com/stevewm/homelab.git
          reference: main
          interval: 300
    restart: unless-stopped

    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  data:
