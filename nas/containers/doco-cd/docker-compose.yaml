---
services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.134.0@sha256:1d40f570403689c762c63009ade3d5d0dc24595bf40f9629a8ab3865e4ddb768

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

    environment:
      TZ: Europe/Amsterdam
      SELF_UPDATE_ENABLED: 'true'
      SELF_UPDATE_STRATEGY: auto
      DEPLOY_CONFIG_BASE_DIR: ./nas/containers
      POLL_CONFIG: |
        - url: https://github.com/stevewm/homelab.git
          reference: main
          interval: 300
    restart: unless-stopped

    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  data:
