[settings]
python.uv_venv_auto = "create|source"
experimental = true
lockfile = true
pin = true

[hooks]
postinstall = "hk install"

[env]
KUBECONFIG = "{{ config_root }}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{ config_root }}/.github/.minijinja.toml"
TALOSCONFIG = "{{ config_root }}/talosconfig"
_.path = ['{{ config_root }}/node_modules/.bin']

[tools]
# https://docs.renovatebot.com/modules/manager/mise/#supported-default-registry-tool-short-names
node = "24.22.2"
python = "3.15.2"
uv = "0.13.6"

# Flux
"github:fluxcd/flux2" = "v2.10.0"

# Kube
"github:CrunchyData/postgres-operator-client" = "0.5.3"
"github:derailed/k9s" = "0.51.0"
"github:helmfile/helmfile" = "v1.8.2"
"github:stern/stern" = "v1.35.0"
helm = "4.3.1"
kubecolor = "0.8.0"
kubens = "0.11.0"
kustomize = "5.8.3"
"github:cilium/hubble" = "1.20.2"

# Talos
"github:siderolabs/talos" = "v1.14.5"

# Tools
"cargo:minijinja-cli" = "3.0.5"
"github:DopplerHQ/cli" = "3.77.1"
"github:gorcon/rcon-cli" = "0.10.3"
gum = "2.0.2"
jq = "1.8.2"
just = "1.59.0"
opentofu = "1.13.2"
yq = "4.54.1"

# Linting
actionlint = "1.7.12"
"github:guarnz/deadvalues" = "v0.1.9"
"github:terror/just-lsp" = "0.10.0"
"github:zavoloklom/docker-compose-linter" = "3.1.0"
hk = "2.10.0"
"npm:renovate" = { version = "44.198.3", trust_policy_excludes = [
  "@yarnpkg/libzip",
] }
oxfmt = "0.74.0"
pkl = "0.32.2"
ruff = "0.17.3"
rumdl = "v0.3.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
zizmor = "1.31.1"
cosign = "3.1.4"
"npm:dclint" = "3.1.0"
