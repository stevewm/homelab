[settings]
python.uv_venv_auto = "create|source"
experimental = true
lockfile = true

[hooks]
postinstall = "hk install"

[env]
KUBECONFIG = "{{ config_root }}/kubeconfig"
TALOSCONFIG = "{{ config_root }}/talosconfig"
MINIJINJA_CONFIG_FILE = "{{ config_root }}/.github/.minijinja.toml"
HOMEBREW_BREWFILE = "{{ config_root }}/.github/Brewfile"
_.path = ['{{config_root}}/node_modules/.bin']

[tools]
# https://docs.renovatebot.com/modules/manager/mise/#supported-default-registry-tool-short-names
uv = "0.13.0"
python = "3"
node = "24.21.0"

# Flux
"github:fluxcd/flux2" = "2.9.6"

# Kube
kubecolor = "0.8.0"
kubens = "0.11.0"
"github:CrunchyData/postgres-operator-client" = "0.5.3"
kustomize = "5.8.3"
helm = "4.3.0"
"github:helmfile/helmfile" = "1.8.1"
"github:derailed/k9s" = "0.51.0"
"github:stern/stern" = "1.34.0"

# Talos
"github:siderolabs/talos" = "1.14.2"

# Tools
yq = "4.54.1"
jq = "1.8.2"
"github:DopplerHQ/cli" = "3.77.0"
"cargo:minijinja-cli" = "3.0.0"
"github:gorcon/rcon-cli" = { version = "0.10.3", exe = "rcon" }
"github:Orange-OpenSource/hurl" = "8.0.1"

# Linting
hk = "2.5.0"
pkl = "0.32.1"
ruff = "0.17.0"
"npm:dclint" = "3.1.0"
"npm:renovate" = { version = "44.151.2", trust_policy_excludes = [
  "@yarnpkg/libzip",
] }
actionlint = "1.7.12"
shellcheck = "0.11.0"
just = "1.58.0"
gum = "2.0.2"
"cargo:just-lsp" = "0.10.0"
rumdl = "v0.3.0"
shfmt = "3.14.1"
crane = "0.22.1"
oxfmt = "latest"
