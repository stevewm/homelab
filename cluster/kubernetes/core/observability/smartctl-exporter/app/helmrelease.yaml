# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  interval: 30m
  maxHistory: 3
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/prometheus-community/charts/prometheus-smartctl-exporter
      ref:
        tag: 0.19.2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    fullnameOverride: *app

    config:
      devices:
        - /dev/nvme0n1
        - /dev/nvme1n1

    serviceMonitor:
      enabled: true
