# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grafana-operator
spec:
  interval: 30m
  timeout: 20m
  maxHistory: 3
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/grafana/helm-charts/grafana-operator
      ref:
        tag: 5.26.0
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
