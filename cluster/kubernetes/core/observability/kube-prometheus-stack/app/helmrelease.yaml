# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kube-prometheus-stack
spec:
  releaseName: *app
  interval: 30m
  maxHistory: 3
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
      ref:
        tag: 94.2.0
  install:
    crds: Skip
    remediation:
      retries: -1
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    cleanPrometheusOperatorObjectNames: true

    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: drop
            sourceLabels:
              - '__name__'
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels:
              - '__name__'
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)

    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels:
              - '__name__'
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: false

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: Kubernetes
        matchLabels:
          dashboards: grafana

    alertmanager:
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        externalUrl: https://am.stevewm.dev
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            memory: 100Mi
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 1Gi
              storageClassName: local-hostpath
      route:
        main:
          enabled: true
          hostnames: ['am.stevewm.dev']
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          annotations:
            gethomepage.dev/name: alertmanager
            gethomepage.dev/enabled: 'true'
            gethomepage.dev/group: observability
            gethomepage.dev/icon: sh-prometheus-light.png
            gethomepage.dev/pod-selector: alertmanager=kube-prometheus-stack

    # https://grafana.com/grafana/dashboards/14588-vpa-recommendations/
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: ['autoscaling.k8s.io']
            resources: ['verticalpodautoscalers']
            verbs: ['list', 'watch']

    prometheusOperator:
      resources:
        requests:
          cpu: 35m
          memory: 256Mi
        limits:
          memory: 512Mi

      prometheusConfigReloader:
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 32Mi

    prometheus:
      prometheusSpec:
        externalUrl: https://prom.stevewm.dev
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 4Gi
        retention: 14d
        retentionSize: 50GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-hostpath
              resources:
                requests:
                  storage: 55Gi
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        enableFeatures:
          - auto-gomaxprocs
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        externalLabels:
          cluster: mini

      route:
        main:
          enabled: true
          hostnames: ['prom.stevewm.dev']
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          annotations:
            gethomepage.dev/name: prometheus
            gethomepage.dev/enabled: 'true'
            gethomepage.dev/group: observability
            gethomepage.dev/icon: sh-prometheus-light.png
            gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
