# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app silence-operator
spec:
  releaseName: *app
  interval: 30m
  maxHistory: 3
  chart:
    kind: OCIRepository
    spec:
      url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
      ref:
        tag: 0.22.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    alertmanagerAddress: http://alertmanager-operated.observability.svc.cluster.local:9093
    networkPolicy:
      enabled: false
