# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  timeout: 5m
  chart:
    kind: OCIRepository
    spec:
      url: oci://mirror.gcr.io/envoyproxy/gateway-helm
      ref:
        tag: 1.10.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
        provider:
          kubernetes:
            deploy:
              type: GatewayNamespace
