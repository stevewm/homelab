# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snapshot-controller
spec:
  releaseName: *app
  interval: 30m
  maxHistory: 3
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
      ref:
        tag: 5.4.1
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    controller:
      args:
        enableDistributedSnapshotting: true

      serviceMonitor:
        create: true

      resources:
        requests:
          cpu: 150m
          memory: 256Mi
        limits:
          memory: 1Gi
