# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-core-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP

  egress:
    - toFQDNs:
        - matchName: api.doppler.com
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
      app.kubernetes.io/instance: external-secrets-operator
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '10250'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-cert-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
      app.kubernetes.io/instance: external-secrets-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP
