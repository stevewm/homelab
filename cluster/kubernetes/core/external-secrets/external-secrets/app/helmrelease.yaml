# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-operator
spec:
  releaseName: external-secrets-operator
  interval: 30m
  maxHistory: 3
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/external-secrets/charts/external-secrets
      ref:
        tag: 2.15.0
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    crds:
      createClusterExternalSecret: false
      createClusterPushSecret: false
    processClusterPushSecret: false
    processClusterExternalSecret: false

    rbac:
      serviceAccountTokenCreate: false

    replicaCount: 2

    deploymentAnnotations:
      configmap.reloader.stakater.com/reload: doppler

    serviceMonitor:
      enabled: true

    podLabels:
      egress.policy.home.arpa/kube-api: 'true'
      egress.policy.home.arpa/deny-all: 'true'

    dnsConfig:
      options:
        - name: ndots
          value: '2'

    certController:
      podLabels:
        egress.policy.home.arpa/kube-api: 'true'
        egress.policy.home.arpa/deny-all: 'true'

    webhook:
      podLabels:
        egress.policy.home.arpa/kube-api: 'true'
        egress.policy.home.arpa/deny-all: 'true'

    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        memory: 80Mi
