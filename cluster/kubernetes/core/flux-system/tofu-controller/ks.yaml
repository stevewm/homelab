# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-tofu-controller
  namespace: flux-system
spec:
  targetNamespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: tofu-controller
      app.kubernetes.io/part-of: flux-operator
  interval: 30m
  timeout: 5m
  path: ./cluster/kubernetes/core/flux-system/tofu-controller/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  wait: true

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-tofu-controller-terraform
  namespace: flux-system
spec:
  targetNamespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: terraform
      app.kubernetes.io/part-of: tofu-controller
  interval: 30m
  timeout: 5m
  path: ./cluster/kubernetes/core/flux-system/tofu-controller/terraform
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  wait: true
