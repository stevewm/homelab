# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 15m
  dependsOn: []
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.9@sha256:25cf04047b733ce372be192d939e243f3909a48a31a719958bc1ce8b1bedef4a
    branchPlanner:
      enabled: true
