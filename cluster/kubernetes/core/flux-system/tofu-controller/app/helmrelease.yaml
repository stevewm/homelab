# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 15m
  dependsOn: []
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.2@sha256:9bf98a36cfa5511412cc5e75ba0b6835ecc0b02e9426054c67c50000b4702e60
    branchPlanner:
      enabled: true
