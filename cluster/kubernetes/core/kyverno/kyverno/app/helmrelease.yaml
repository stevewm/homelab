# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    global:
      image:
        registry: ghcr.io
    grafana:
      enabled: true
      grafanaDashboard:
        create: true
        folder: security
        matchLabels:
          grafana.internal/instance: grafana

    admissionController:
      podLabels:
        egress.policy.home.arpa/kube-api: 'true'
        egress.policy.home.arpa/deny-all: 'true'
      serviceMonitor:
        enabled: true

    backgroundController:
      podLabels:
        egress.policy.home.arpa/kube-api: 'true'
        egress.policy.home.arpa/deny-all: 'true'
      serviceMonitor:
        enabled: true

    cleanupController:
      enabled: false

    reportsController:
      enabled: false

    migration:
      enabled: false
