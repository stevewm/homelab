# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-vikunja
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app vikunja
  interval: 30m
  timeout: 5m
  path: ./cluster/kubernetes/apps/selfhosted/vikunja/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  wait: true
  components:
    - ../../../../components/volsync/hetzner
    - ../../../../components/sso-secret
    - ../../../../components/dragonfly
    - ../../../../components/postgres
    - ../../../../components/smtp
  patches:
    - patch: |-
        apiVersion: postgres-operator.crunchydata.com/v1
        kind: PostgresCluster
        metadata:
          name: ${APP}
        spec:
          proxy:
            pgBouncer:
              config:
                global:
                  ignore_startup_parameters: default_transaction_isolation
  postBuild:
    substitute:
      APP: *app
