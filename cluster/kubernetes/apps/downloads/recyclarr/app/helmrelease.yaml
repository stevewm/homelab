# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 30m
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: recyclarr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    defaultPodOptions:
      labels:
        egress.policy.home.arpa/internet: 'true'
        egress.policy.home.arpa/deny-all: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      recyclarr:
        type: cronjob

        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        annotations:
          reloader.stakater.com/auto: 'true'

        pod:
          annotations:
            k8s.ksgate.org/sonarr: |
              {
                "apiVersion": "apps/v1",
                "kind": "Deployment",
                "name": "sonarr",
                "expression": "resource.status.updatedReplicas >= 1"
              }
            k8s.ksgate.org/radarr: |
              {
                "apiVersion": "apps/v1",
                "kind": "Deployment",
                "name": "radarr",
                "expression": "resource.status.updatedReplicas >= 1"
              }
          schedulingGates:
            - name: k8s.ksgate.org/sonarr
            - name: k8s.ksgate.org/radarr

        cronjob:
          schedule: '@daily'
          backoffLimit: 0
          successfulJobsHistory: 0

        containers:
          recyclarr:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
            env:
              COMPlus_EnableDiagnostics: '0'
              RADARR_API_KEY:
                secretKeyRef:
                  name: radarr
                  key: api_key
              SONARR_API_KEY:
                secretKeyRef:
                  name: sonarr
                  key: api_key
            args: ['sync', '--log', 'debug']
            resources:
              requests:
                cpu: 10m
                memory: 92Mi
              limits:
                memory: 512Mi

    persistence:
      config:
        existingClaim: recyclarr-config
      config-file:
        type: configMap
        name: recyclarr
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
