# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bazarr
spec:
  interval: 30m
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: bazarr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    defaultPodOptions:
      labels:
        ingress.policy.home.arpa/envoy-internal: 'true'
        egress.policy.home.arpa/internet: 'true'
        egress.policy.home.arpa/deny-all: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      bazarr:
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        annotations:
          reloader.stakater.com/auto: 'true'

        containers:
          bazarr:
            image:
              repository: ghcr.io/home-operations/bazarr
              tag: 1.6.2@sha256:17dc1cff22e99694ffbfb06555526cb47a66b362b4d6c982f06b557f7caae2bb
            env:
              BAZARR__PORT: &port 80
              BAZARR__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bazarr
                    key: api_key
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 127Mi
              limits:
                memory: 318Mi

          subcleaner:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.8.0@sha256:a20644562fba94773e594885cb001aadb5a3172175f13ac1215e5b2033c9200e
            args:
              - --repo=https://github.com/KBlixt/subcleaner
              - --ref=master
              - --period=24h
              - --root=/addons
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 128Mi

    service:
      bazarr:
        ports:
          http:
            port: *port

    route:
      bazarr:
        hostnames: ['bzr.stevewm.dev']
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        annotations:
          gethomepage.dev/name: *app
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: downloads
          gethomepage.dev/icon: sh-bazarr-light.png
          gethomepage.dev/widget.key: '{{ `{{HOMEPAGE_VAR_BAZARR_API_KEY}}` }}'
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: 'http://bazarr.downloads.svc.cluster.local'

    persistence:
      config:
        existingClaim: bazarr-config
      config-cache:
        type: emptyDir
        globalMounts:
          - path: /config/cache
      media:
        type: nfs
        server: lilnas.home.arpa
        path: /volume1/Media
        globalMounts:
          - path: /data/media
      tmp:
        type: emptyDir
      addons:
        type: emptyDir
