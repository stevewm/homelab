# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/kguardian-dev/charts/kguardian
      ref:
        tag: 1.29.2
  interval: 30m
  values:
    broker:
      metrics:
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true
      resources:
        limits:
          memory: 2Gi
    controller:
      excludedNamespaces:
        - kguardian
      resources:
        limits:
          memory: 1Gi
