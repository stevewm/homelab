# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-stevewm
spec:
  metadata:
    labels:
      app: renovate-operator
  serviceAccount:
    name: renovate-job
  provider:
    name: github
  discoveryFilters: ['stevewm/*']
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ALLOWED_COMMANDS
      value: |-
        ["pnpm run bundle", "^mise install && mise lock$"]
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: |-
        ["mise"]
  image: ghcr.io/renovatebot/renovate:44.175.0-full@sha256:39f2a271a521bfc5068f1320137ba4cd8ec3ed55120366e3dc710b69fad6438e
  parallelism: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 0 * * * *
  securityContext:
    container:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ['ALL']
  extraVolumes:
    - name: mise-bin
      image:
        # renovate: datasource=docker
        reference: ghcr.io/jdx/mise:2026.10.17
        pullPolicy: IfNotPresent
  extraVolumeMounts:
    - name: mise-bin
      # /home/ubuntu/bin is the first entry on PATH and is empty in the base
      # image, so mounting mise's bin dir there makes `mise` resolvable
      # without touching PATH or shadowing anything else on it.
      mountPath: /home/ubuntu/bin
      subPath: usr/local/bin
      readOnly: true
  secretRef: renovate-secret

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: botty-hill-pem
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: botty-hill-pem
  data:
    - secretKey: private_key_pem
      remoteRef:
        key: BOTTY_HILL_PRIVATE_KEY

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: botty-hill-auth-token
spec:
  appID: '963455'
  installID: '53550287'
  auth:
    privateKey:
      secretRef:
        name: botty-hill-pem
        key: private_key_pem

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: botty-hill-auth-token
spec:
  refreshInterval: 30m
  target:
    name: renovate-secret
    template: # template secret to use GITHUB_COM_TOKEN
      type: Opaque
      engineVersion: v2
      data:
        GITHUB_COM_TOKEN: '{{ .token }}'
        GITHUB_COM_USER: c3RldmV3bQ==
        RENOVATE_TOKEN: '{{ .token }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: botty-hill-auth-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-job
