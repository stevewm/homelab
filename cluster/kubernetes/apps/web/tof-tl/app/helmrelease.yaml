# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tof-tl
spec:
  interval: 30m
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: tof-tl
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      tof-tl:
        strategy: RollingUpdate
        replicas: 2
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        containers:
          tof-tl:
            image:
              repository: ghcr.io/stevewm/tof-map
              tag: latest@sha256:c23814f7b2aad81fd005645b70ab3b8b32c54e8ba65f36042defa4d115ec7e17
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi

    service:
      tof-tl:
        ports:
          web:
            port: &port 3000

    route:
      tof-tl:
        hostnames: ['tl.stevewm.dev']
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        annotations:
          gethomepage.dev/name: ToF Map
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: games
          gethomepage.dev/icon: mdi-map-search-outline-#ffffff

    persistence:
      cache:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /app/.next/cache
